org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The Kotlin standard library must NOT be packaged into the extension APK.
# Komikku/Mihon load extensions with a parent-LAST class loader, so a bundled stdlib shadows the
# app's own copy of kotlin.coroutines.Continuation / jvm.internal.ContinuationImpl and every
# suspend call dies with java.lang.IncompatibleClassChangeError.
# (Symptom: the extension loads, its sources are listed, and opening one kills the app.)
kotlin.stdlib.default.dependency=false
